<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bussie - OV Terminal Platina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        .terminal {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            width: 220px;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #007bff;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover { background-color: #0056b3; }
        #log {
            margin-top: 30px;
            padding: 15px;
            background: #333;
            color: #55ff55;
            font-family: monospace;
            border-radius: 5px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
            height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h1>🚌 Bussie OV-Chipkaart Terminal</h1>
    <p>Klik op de knop van een reiziger om in of uit te checken bij de paal!</p>

    <!-- De visuele kaarten van de reizigers komen hier -->
    <div class="terminal" id="passagiers-lijst"></div>

    <!-- Het logboek op het scherm -->
    <h3>Terminal Log:</h3>
    <div id="log">Systeem stand-by...<br></div>

    <!-- Het audio-element voor de bliep -->
    <audio id="beep-sound" src="beep.mp3" preload="auto"></audio>

    <!-- We koppelen ons JavaScript bestand -->
    <script src="ovpaal_platina.js"></script>
</body>
</html>
